<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a2542a" />
    <meta
      name="description"
      content="A beginner guide, grinder finder, and taste-matched coffee recommendations for Delhi NCR."
    />
    <title>Brew — specialty coffee in Delhi NCR</title>
    <script>
      // Apply the saved theme before first paint, otherwise a light-theme user
      // gets a dark flash on every load while React boots.
      try {
        var t = localStorage.getItem('brew.theme.v1')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
